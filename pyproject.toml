[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lxmfnotify"
version = "0.1.0"
description = "Filter stdin by pattern and send the matches as LXMF messages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = ["rns", "lxmf"]

[project.scripts]
lxmfnotify = "lxmfnotify.cli:main"

[tool.setuptools]
packages = ["lxmfnotify"]
